<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>GameZone – Carrusel</title>
</head>
<body>
<div class="container">
    <div id="carruselJuegos" class="carousel slide">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carruselJuegos" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carruselJuegos" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carruselJuegos" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
        <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=900&h=450&fit=crop" class="d-block w-100" alt="Shadow Realm">
        <div class="carousel-caption d-none d-md-block">
            <h5>Shadow Realm: Origins</h5>
            <p>RPG de mundo abierto con más de 200 horas de contenido.</p>
        </div>
        </div>
        <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=900&h=450&fit=crop" class="d-block w-100" alt="Cyber Warfare">
        <div class="carousel-caption d-none d-md-block">
            <h5>Cyber Warfare 2077</h5>
            <p>FPS futurista en una ciudad distópica controlada por megacorporaciones.</p>
        </div>
        </div>
        <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=900&h=450&fit=crop" class="d-block w-100" alt="Dragon Keep">
        <div class="carousel-caption d-none d-md-block">
            <h5>Dragon's Keep Online</h5>
            <p>MMORPG masivo con batallas épicas de 100 jugadores en tiempo real.</p>
        </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carruselJuegos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carruselJuegos" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
